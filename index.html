<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FF Trade Analyzer</title>
  <meta name="description" content="Multi-source redraft and dynasty fantasy football trade analyzer">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 class="sr-only">FF Trade Analyzer</h1>
      <a class="brand" href="#/trade" aria-label="Home">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><ellipse cx="16" cy="16" rx="14" ry="9" transform="rotate(-35 16 16)" fill="currentColor"/><path d="M11 21l10-10M13 15l2 2M15 13l2 2M17 11l2 2" stroke="var(--brand-ink)" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Trade Analyzer</span>
      </a>
      <div class="mode-toggle" role="group" aria-label="Valuation mode">
        <button type="button" data-mode="redraft" id="mode-redraft">Redraft</button>
        <button type="button" data-mode="dynasty" id="mode-dynasty">Dynasty</button>
      </div>
      <div class="topbar-right">
        <label class="profile-select" title="League profile">
          <span class="sr-only">League profile</span>
          <select id="profile-select"></select>
        </label>
        <button class="data-pill" id="data-pill" title="Data status — open the sync dashboard"><span class="dot"></span><span class="txt">No data</span><span class="txt-short" aria-hidden="true"></span></button>
        <button class="btn btn-primary" id="sync-btn" title="Refresh all data sources"><span class="sync-icon" aria-hidden="true">⟳</span><span class="lbl">Sync All</span></button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#/trade" data-view="trade">Trade</a>
      <a href="#/team" data-view="team">My Team</a>
      <a href="#/players" data-view="players">Players</a>
      <a href="#/compare" data-view="compare">Compare</a>
      <a href="#/rookies" data-view="rookies" class="dynasty-only">Rookies &amp; Picks</a>
      <a href="#/data" data-view="data">Data</a>
      <a href="#/settings" data-view="settings">Settings</a>
      <a href="#/model" data-view="model">Model</a>
      <a href="#/help" data-view="help">Help</a>
    </nav>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view" class="view" tabindex="-1"><div class="loading">Loading…</div></main>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript>This application requires JavaScript.</noscript>
  <script>
    // Opened by double-clicking index.html? Browsers block the app's modules from file:// — explain what to do instead.
    if (location.protocol === 'file:') {
      document.getElementById('view').innerHTML =
        '<div class="panel" style="max-width:640px;margin:2rem auto;font-size:1.05rem">' +
        '<h2>Almost there!</h2>' +
        '<p>This page can\'t be opened directly. Please close this tab and go back to the app folder, then double-click:</p>' +
        '<ul><li><strong>Windows:</strong> Start Trade Analyzer (Windows).bat</li>' +
        '<li><strong>Mac:</strong> Start Trade Analyzer (Mac).command</li>' +
        '<li><strong>Linux:</strong> Start Trade Analyzer (Linux).sh</li></ul>' +
        '<p>The app will open in your browser automatically. See <em>HOW TO START.txt</em> in the same folder for simple step-by-step help.</p></div>';
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
